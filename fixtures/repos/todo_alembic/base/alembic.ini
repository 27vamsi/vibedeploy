[alembic]
script_location = alembic

# Only works if the working directory is the checkout, which is why
# `buildjob/migrate_alembic.py` chdirs into it before running anything.
prepend_sys_path = .

# Deliberately left pointing nowhere useful. A real repo either has a
# placeholder here or has the real URL committed by mistake, and neither is
# allowed to decide which database the migrations touch.
sqlalchemy.url = postgresql://localhost/todo_dev

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
