[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibedeploy-shim"
version = "0.5.0.dev0"
requires-python = ">=3.12"
# Deliberately no dependencies. This gets installed into the customer's image
# alongside whatever versions their app already pins, so it must not drag
# anything in. SQLAlchemy and Starlette are detected at runtime, not required.
dependencies = []

[tool.setuptools]
packages = ["vibedeploy_shim"]
