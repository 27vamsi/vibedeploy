[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibedeploy-shim"
version = "0.5.0.dev0"
description = "vibedeploy identity shim: per-request identity into every Postgres transaction"
requires-python = ">=3.9"
# No runtime dependencies on purpose. The shim is layered on top of an image we
# did not build, so it must not drag versions in and break the app's own pins.
dependencies = []

[tool.setuptools]
packages = ["vibedeploy_shim"]
