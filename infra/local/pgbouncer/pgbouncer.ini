; Transaction pooling. This is the hostile environment the shim has to survive:
; a connection is handed to a different request between transactions, so any
; identity set at session level leaks to the next user. Readme.md section 8 M2.

[databases]
; Wildcard so every per-app database and the platform database route through
; without editing this file per app.
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Per-app runtime and agent roles are created at deploy time with random
; passwords, so a static userlist can never list them. auth_query makes
; PgBouncer look the role up in Postgres instead, which is the only scheme that
; works for roles that did not exist when this file was written.
;
; PgBouncer cannot reuse a SCRAM verifier fetched this way to log in to the
; server; that is why the server side is trust (see docker-compose.yml). The
; client side is still a real SCRAM exchange, so passwords are genuinely checked.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = vd_admin
auth_dbname = vibedeploy
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename = $1

; The setting that makes the pooling test meaningful.
pool_mode = transaction

; Keep server_reset_query empty: in transaction mode PgBouncer already returns
; the connection in a clean state, and we want a leaked session-level setting
; to stay visible so the negative test can catch it rather than be scrubbed.
server_reset_query =

max_client_conn = 1000
default_pool_size = 20
min_pool_size = 0
reserve_pool_size = 5

ignore_startup_parameters = extra_float_digits,options

admin_users = vd_admin
stats_users = vd_admin

log_connections = 0
log_disconnections = 0
