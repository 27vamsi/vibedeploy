[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; SCRAM pass-through: pgbouncer looks the verifier up in pg_shadow with
; auth_user, so every per-app runtime/migrator role works without us
; maintaining a userlist.txt. Local only.
auth_type = scram-sha-256
auth_user = vd_admin
auth_dbname = vibedeploy
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename = $1
; auth_user's own password, so pgbouncer can log in and run auth_query.
auth_file = /etc/pgbouncer/userlist.txt

; The setting M1 and M2 exist to defend against. A connection is handed back
; to the pool at COMMIT, so any session-level state leaks between users.
pool_mode = transaction

max_client_conn = 1000
default_pool_size = 5
min_pool_size = 0
reserve_pool_size = 2
server_reset_query =
ignore_startup_parameters = extra_float_digits,options

logfile = /dev/stdout
pidfile = /tmp/pgbouncer.pid
admin_users = vd_admin
stats_users = vd_admin
