[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibedeploy"
version = "0.5.0.dev0"
requires-python = ">=3.12"
dependencies = []

# Kept to what the landed milestones actually use. Add each milestone's
# dependencies as it lands, not before.
[project.optional-dependencies]
dev = [
    "asyncpg>=0.30",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # M2 runs a real FastAPI + SQLAlchemy app through PgBouncer.
    "sqlalchemy[asyncio]>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    # M6 runs the sidecar as its own process; it is Starlette, not FastAPI.
    "starlette>=0.40",
    # Starlette needs this to read *any* form body, including the urlencoded
    # one the sidecar's own login page posts.
    "python-multipart>=0.0.9",
]

# Listed explicitly; add each new top-level package as its milestone lands.
[tool.setuptools]
packages = ["kernel", "buildjob", "sidecar"]

[tool.setuptools.package-data]
kernel = ["sql/*.sql", "sql/templates/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Tests share the fixtures' loop; asyncpg connections are bound to the loop
# that created them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# The shim is importable from the test process, but bootstrap/sitecustomize.py
# is not: it only goes on PYTHONPATH for a real deployed app.
pythonpath = ["shims/python"]
markers = [
    "negative: proves a test can fail; never delete or skip to make CI green",
]
