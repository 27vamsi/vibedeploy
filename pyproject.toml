[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibedeploy"
version = "0.5.0.dev0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "asyncpg>=0.30",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # The M2 concurrency proof runs a real FastAPI + SQLAlchemy app.
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
]

# Listed explicitly; add each new top-level package as its milestone lands.
[tool.setuptools]
packages = ["kernel"]

[tool.setuptools.package-data]
kernel = ["sql/*.sql", "sql/templates/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# Tests share the fixtures' loop; asyncpg connections are bound to the loop
# that created them.
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# The shim is importable from the test process, but sitecustomize.py is not:
# it lives in shims/python/bootstrap and only goes on PYTHONPATH for a real app.
pythonpath = ["shims/python"]
markers = [
    "negative: proves a test can fail; never delete or skip to make CI green",
]
